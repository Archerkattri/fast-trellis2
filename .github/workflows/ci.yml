name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py'; then
            exit 1
          fi
      - name: Compile tracked Python source
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
