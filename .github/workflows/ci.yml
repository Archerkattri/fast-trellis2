name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py'; then
            exit 1
          fi
      - name: Compile first-party source
        run: python -m compileall -q trellis2 taylor_utils_ss faster_utils_slat fft token_slat
      - name: Install CPU validation dependency
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check cascade score lifecycle and optional attention dispatch
        run: |
          python tools/verify_cascade_scores.py
          python tools/verify_sage_attention.py
