name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  cpu-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.py'; then
            exit 1
          fi
      - name: Compile first-party source
        run: python -m compileall -q trellis2 taylor_utils_ss faster_utils_slat fft token_slat tools benchmarks
      - name: Install CPU validation dependency
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 easydict==1.13 tqdm==4.67.1 ruff==0.14.3
      - name: Check cascade score lifecycle and optional attention dispatch
        run: |
          python tools/verify_cascade_scores.py
          python tools/verify_sage_attention.py
          python tools/verify_fast_norm.py
          python tools/verify_profiles.py
      - name: Check release metadata, local documentation links and CLI
        run: |
          python tools/verify_release.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then python tools/verify_release.py "$GITHUB_REF_NAME"; fi
          python tools/generate.py --help
          bash -n setup.sh
          bash setup.sh --help
      - name: Lint owned integration code
        run: |
          ruff check --select E9,F63,F7,F82 trellis2 tools benchmarks example.py example_faster.py
          ruff format --check trellis2/_version.py trellis2/pipelines/profiles.py trellis2/modules/attention/sage.py trellis2/modules/fast_norm.py tools/generate.py tools/verify_profiles.py tools/verify_release.py benchmarks/*.py
